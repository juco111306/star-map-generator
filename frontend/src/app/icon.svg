<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B18" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DB" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A27D21" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle rounded badge for contrast on light and dark browser tabs -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="#D4AF37" stroke-width="1.6" stroke-opacity="0.6" />
  
  <!-- Subtle celestial compass circle -->
  <circle cx="32" cy="32" r="21" fill="url(#glow)" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="1.5 2.5" stroke-opacity="0.4" />

  <!-- 8-Pointed Celestial Starburst -->
  <!-- 4 Main Cardinal Spikes (N, S, E, W) -->
  <path d="M32 9 Q32 28 35 32 Q32 32 32 55 Q32 32 29 32 Q32 28 32 9 Z" fill="url(#gold)" />
  <path d="M9 32 Q28 32 32 35 Q32 32 55 32 Q32 32 32 29 Q28 32 9 32 Z" fill="url(#gold)" />
  
  <!-- 4 Diagonal Spikes (NE, NW, SE, SW) -->
  <path d="M16 16 Q29 29 32 32 Q29 29 16 16 Z M48 16 Q35 29 32 32 Q35 29 48 16 Z M16 48 Q29 35 32 32 Q29 35 16 48 Z M48 48 Q35 35 32 32 Q35 35 48 48 Z" fill="url(#gold)" opacity="0.85" stroke="url(#gold)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Center brilliant star core -->
  <circle cx="32" cy="32" r="3.2" fill="#FFFFFF" />
  
  <!-- Tiny celestial constellation sparkles -->
  <circle cx="20" cy="20" r="1.2" fill="#FFF3D4" opacity="0.8" />
  <circle cx="44" cy="20" r="1.2" fill="#FFF3D4" opacity="0.8" />
  <circle cx="20" cy="44" r="1.2" fill="#FFF3D4" opacity="0.8" />
  <circle cx="44" cy="44" r="1.2" fill="#FFF3D4" opacity="0.8" />
</svg>
